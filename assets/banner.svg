<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">RubioKo — Full-Stack Developer · Product Builder</title>
  <desc id="desc">Animated navy and blue banner with gentle light pulses and moving particles. The text remains stationary.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="0.5"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#0C1F3D"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#1677FF" stop-opacity=".28"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#1F6FEB" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#7EE7FC"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58A6FF" stroke-opacity=".065"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>@media (prefers-reduced-motion: reduce) { .moving { display:none; } }</style>
  </defs>
  <rect width="1200" height="340" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="12" fill="url(#grid)"/>
  <ellipse cx="1060" cy="200" rx="330" ry="230" fill="url(#halo)"/>
  <ellipse class="moving" cx="1030" cy="190" rx="270" ry="170" fill="url(#halo)"><animate attributeName="opacity" values=".3;.85;.3" dur="8s" repeatCount="indefinite"/></ellipse>
  <g fill="none" stroke="#58A6FF" stroke-opacity=".2" stroke-width="1">
    <path d="M820 290L930 205L1050 235L1140 120"/><path d="M930 205L910 105L1030 75L1140 120"/><path d="M1050 235L1170 290"/>
  </g>
  <path d="M790 340C860 270 940 225 1020 190S1150 100 1200 65" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g class="moving" fill="#7EE7FC">
    <circle r="5" filter="url(#glow)"><animateMotion path="M790 340C860 270 940 225 1020 190S1150 100 1200 65" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="2.5"><animateMotion path="M930 205L1050 235L1140 120" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="2"><animateMotion path="M910 105L1030 75L1140 120" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0C1F3D" stroke="#58A6FF" stroke-width="1.5"><circle cx="910" cy="105" r="4"/><circle cx="1030" cy="75" r="4"/><circle cx="1140" cy="120" r="5"/><circle cx="1050" cy="235" r="4"/><circle cx="930" cy="205" r="6"/></g>
  <circle class="moving" cx="930" cy="205" r="10" fill="none" stroke="#58A6FF"><animate attributeName="r" values="7;23" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="4s" repeatCount="indefinite"/></circle>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="150" font-size="82" font-weight="750" letter-spacing="-2" fill="#F0F6FC">RubioKo</text>
    <text x="68" y="200" font-size="25" fill="#C9D1D9">Full-Stack Developer · Product Builder</text>
    <text x="68" y="276" font-size="20" fill="#8B949E">Web platforms, automation &amp; thoughtful interfaces.</text>
  </g>
  <rect x="68" y="226" width="400" height="2" rx="1" fill="#1F6FEB" opacity=".4"/>
  <rect class="moving" x="68" y="226" width="70" height="2" rx="1" fill="#7EE7FC"><animate attributeName="x" values="68;398;68" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.85;.2" dur="7s" repeatCount="indefinite"/></rect>
</svg>
